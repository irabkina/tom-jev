# Report scenario set — B. FALSE POSITIVE
#
# Sam wants to retrieve a report, which is in one of two rooms.
# Across all four conditions Sam has the same goal and the same two
# candidate destinations. Only the report's actual location and Sam's
# belief about it vary.
#
# Reality: report in the conference room
# Belief:  report in the office
#
# Sam's false belief predicts the office, while the world state alone
# points to the conference room.

id: report_false_positive
description: >
  Sam wants to retrieve a report. The report is in the conference room,
  but Sam incorrectly believes that the report is in the office.

scenario_set: report

variant:
  type: false_positive

entities:
  agents:
    - id: sam
      name: Sam
  locations:
    - id: office
      name: office
    - id: conference_room
      name: conference room
  objects:
    - id: report
      name: report

observations: []

world_state:
  - predicate: located
    subject: report
    location: office
    value: false

  - predicate: located
    subject: report
    location: conference_room
    value: true

goals:
  - agent: sam
    type: obtain
    object: report

mental_state:
  - type: belief
    agent: sam
    proposition:
      predicate: located
      subject: report
      location: office
      value: true

question:
  type: action_prediction
  agent: sam
  options:
    - go_to_office
    - go_to_conference_room

ground_truth:
  answer: go_to_office
  explanation: >
    Sam falsely believes the report is in the office, so Sam should act on
    that belief and go to the office, even though the report is actually
    in the conference room.

annotations:
  world_supports_action: false
  agent_believes_action_supported: true
  belief_matches_reality: false
  belief_changes_expected_action: true
  tags:
    - false_belief
    - belief_reality_mismatch
    - rerepresentation_target
