# Coffee scenario set — C. FALSE NEGATIVE
#
# Sam wants to obtain coffee from the kitchen but needs a cup to do so.
# Across all four conditions Sam has the same goal, coffee is available in
# the kitchen, Sam does not have a cup, and the same action is predicted.
# Only cup availability and Sam's belief about it vary.
#
# Reality: cup available
# Belief:  cup unavailable
#
# Objective reality supports going to the kitchen, but Sam's false belief
# predicts that Sam will not do so.

id: coffee_false_negative
description: >
  Sam wants coffee. Sam does not have a cup. Coffee and cups are
  available in the kitchen, but Sam incorrectly believes that no cups
  are available there.

scenario_set: coffee

variant:
  type: false_negative

entities:
  agents:
    - id: sam
      name: Sam

  locations:
    - id: kitchen
      name: kitchen

  objects:
    - id: cup
      name: cup
    - id: coffee
      name: coffee

observations: []

world_state:
  - predicate: has
    subject: sam
    object: cup
    value: false

  - predicate: available
    subject: coffee
    location: kitchen
    value: true

  - predicate: available
    subject: cup
    location: kitchen
    value: true

goals:
  - agent: sam
    type: obtain
    object: coffee

mental_state:
  - type: belief
    agent: sam
    proposition:
      predicate: available
      subject: cup
      location: kitchen
      value: false

question:
  type: action_prediction
  agent: sam

  options:
    - go_to_kitchen
    - do_not_go_to_kitchen

ground_truth:
  answer: do_not_go_to_kitchen
  explanation: >
    Although a cup is actually available, Sam believes that the
    necessary cup is unavailable and therefore should not expect going
    to the kitchen to achieve the coffee goal.

annotations:
  world_supports_action: true
  agent_believes_action_supported: false
  belief_matches_reality: false
  belief_changes_expected_action: true
  tags:
    - false_belief
    - belief_reality_mismatch
    - rerepresentation_target
