# Report scenario set — A. TRUE POSITIVE
#
# Sam wants to retrieve a report, which is in one of two rooms.
# Across all four conditions Sam has the same goal and the same two
# candidate destinations. Only the report's actual location and Sam's
# belief about it vary.
#
# Reality: report in the office
# Belief:  report in the office
#
# Reality and belief agree, so acting on either leads to the same place.

id: report_true_positive
description: >
  Sam wants to retrieve a report. The report is in the office, and Sam
  believes that the report is in the office.

scenario_set: report

variant:
  type: true_positive

entities:
  agents:
    - id: sam
      name: Sam
  locations:
    - id: office
      name: office
    - id: conference_room
      name: conference room
  objects:
    - id: report
      name: report

observations: []

world_state:
  - predicate: located
    subject: report
    location: office
    value: true

  - predicate: located
    subject: report
    location: conference_room
    value: false

goals:
  - agent: sam
    type: obtain
    object: report

mental_state:
  - type: belief
    agent: sam
    proposition:
      predicate: located
      subject: report
      location: office
      value: true

question:
  type: action_prediction
  agent: sam
  options:
    - go_to_office
    - go_to_conference_room

ground_truth:
  answer: go_to_office
  explanation: >
    Sam wants the report and correctly believes it is in the office, so
    Sam should go to the office.

annotations:
  world_supports_action: true
  agent_believes_action_supported: true
  belief_matches_reality: true
  belief_changes_expected_action: false
  tags:
    - belief_reality_match
    - positive_control
