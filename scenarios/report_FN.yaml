# Report scenario set — C. FALSE NEGATIVE
#
# Sam wants to retrieve a report, which is in one of two rooms.
# Across all four conditions Sam has the same goal and the same two
# candidate destinations. Only the report's actual location and Sam's
# belief about it vary.
#
# Reality: report in the office
# Belief:  report not in the office
#
# The world state alone points to the office, while Sam's false belief
# predicts the conference room.

id: report_false_negative
description: >
  Sam wants to retrieve a report. The report is in the office, but Sam
  incorrectly believes that the report is not in the office.

scenario_set: report

variant:
  type: false_negative

entities:
  agents:
    - id: sam
      name: Sam
  locations:
    - id: office
      name: office
    - id: conference_room
      name: conference room
  objects:
    - id: report
      name: report

observations: []

world_state:
  - predicate: located
    subject: report
    location: office
    value: true

  - predicate: located
    subject: report
    location: conference_room
    value: false

goals:
  - agent: sam
    type: obtain
    object: report

mental_state:
  - type: belief
    agent: sam
    proposition:
      predicate: located
      subject: report
      location: office
      value: false

question:
  type: action_prediction
  agent: sam
  options:
    - go_to_office
    - go_to_conference_room

ground_truth:
  answer: go_to_conference_room
  explanation: >
    Although the report is actually in the office, Sam believes it is not
    there, so Sam should go to the other candidate location.

annotations:
  world_supports_action: false
  agent_believes_action_supported: true
  belief_matches_reality: false
  belief_changes_expected_action: true
  tags:
    - false_belief
    - belief_reality_mismatch
    - rerepresentation_target
