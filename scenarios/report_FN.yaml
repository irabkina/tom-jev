id: report_false_negative
description: >
  Sam wants to retrieve a report. The report is in the office, but Sam
  incorrectly believes that the report is not in the office.

scenario_set: report

variant:
  type: false_negative

entities:
  agents:
    - id: sam
      name: Sam
  locations:
    - id: office
      name: office
  objects:
    - id: report
      name: report

observations: []

world_state:
  - predicate: located
    subject: report
    location: office
    value: true

goals:
  - agent: sam
    type: obtain
    object: report

mental_state:
  - type: belief
    agent: sam
    proposition:
      predicate: located
      subject: report
      location: office
      value: false

question:
  type: action_prediction
  agent: sam
  options:
    - go_to_office
    - do_not_go_to_office

ground_truth:
  answer: do_not_go_to_office
  explanation: >
    Sam wants to retrieve the report but falsely believes that the report
    is not in the office, so Sam should not go to the office to retrieve it.

annotations:
  world_supports_action: true
  agent_believes_action_supported: false
  belief_matches_reality: false
  mental_state_required: true
  tags:
    - false_belief
    - belief_reality_mismatch
    - rerepresentation_target
