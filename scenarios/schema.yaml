# Schema for Jev re-representation experiment scenarios.
#
# Scenarios separate:
#   1. Observable events/actions
#   2. Objective world state
#   3. Agent goals
#   4. How an agent came to believe what they believe
#   5. Agents' explicit mental states
#   6. Ground-truth answers
#
# There are three conditions, differing in exactly one section each:
#
#   sparse   uses (1), (2) and (3)
#   history  adds (4) — the evidence a belief follows from
#   rich     adds (5) instead — the belief itself
#
# Mental states should never be inferred from world_state when constructing
# representations. This separation is the core experimental manipulation.
#
# (4) and (5) are two presentations of the same belief: the history must
# ENTAIL what the mental state ASSERTS, without asserting it. A corpus test
# recovers the belief from the events and holds the two to agreement, so
# `history` and `rich` differ in explicitness and not in content.

id: string

# Human-readable description for researchers.
# Metadata only; must NOT be passed to Jev.
description: string

# Identifier grouping structurally matched scenarios.
scenario_set: string

# Experimental condition within a matched scenario set.
variant:
  # Initial pilot values:
  #   true_positive   - world supports action; agent believes it does
  #   false_positive  - world conflicts; agent believes it supports action
  #   false_negative  - world supports action; agent believes it conflicts
  #   true_negative   - world conflicts; agent believes it conflicts
  type: string

# ---------------------------------------------------------------------------
# ENTITIES
# ---------------------------------------------------------------------------

entities:
  agents:
    - id: string
      name: string

  locations:
    - id: string
      name: string

  objects:
    - id: string
      name: string

# ---------------------------------------------------------------------------
# OBSERVATIONS
# ---------------------------------------------------------------------------
# Observable events that have occurred before the target action.
# Included in both sparse and rich representations.
#
# Event arguments are intentionally flexible during the pilot.

observations:
  - type: string
    agent: string
    destination: string | null
    object: string | null
    target_agent: string | null

# ---------------------------------------------------------------------------
# WORLD STATE
# ---------------------------------------------------------------------------
# Objective facts about the environment.
#
# These describe what is actually true independently of what an agent
# believes. Included in both sparse and rich representations.

world_state:
  - predicate: string
    subject: string
    object: string | null
    location: string | null
    value: boolean | string | number

# ---------------------------------------------------------------------------
# GOALS
# ---------------------------------------------------------------------------
# Goals attributed to agents in the scenario.
#
# For the pilot experiment, goals are given as part of the input rather than
# inferred. This allows us to test whether different representations of the
# world and the agent's beliefs lead to different predictions about how the
# agent will act to achieve the same goal.
#
# Goals are included in both sparse and rich representations.
#
# Example:
#   goals:
#     - agent: sam
#       type: obtain
#       object: coffee

goals:
  - agent: string
    type: string

    # Optional target arguments.
    object: string | null
    location: string | null
    target_agent: string | null

# ---------------------------------------------------------------------------
# HISTORY
# ---------------------------------------------------------------------------
# How the agent came to believe what they believe: observable events, each
# settling one claim, each witnessed by whoever was there to see it.
#
# OMITTED from sparse and rich representations.
# INCLUDED in the history representation.
#
# An agent's belief about a claim is whatever the LAST event they witnessed
# settled. A false belief is a claim settled one way in their view and
# settled otherwise out of it:
#
#   history:
#     - proposition:
#         predicate: located
#         subject: report
#         location: office
#         value: true
#       witnessed_by: [sam]
#
#     - proposition:
#         predicate: located
#         subject: report
#         location: conference_room
#         value: true
#       witnessed_by: []
#
# `proposition` takes the same form as in world_state and mental_state, and
# may nest in the same way. A nested event is an agent coming to hold a
# belief, which is an ordinary observable thing that another agent may
# witness or miss — this is how the attribution and second-order sets get a
# history, and it sits at the same level as any other claim:
#
#     - proposition:
#         predicate: believes
#         subject: alex
#         proposition:
#           predicate: located
#           subject: meeting
#           location: office
#           value: true
#       witnessed_by: [sam]
#
# Two rules the corpus tests enforce:
#
#   ONE AGENT'S ACCESS. The history represents the access of exactly one
#   agent — `question.agent`, the one being predicted. Nothing is predicted
#   about anyone else, so no other agent appears in `witnessed_by`. Another
#   agent's belief reaches the history only as the event this agent missed.
#
#   EQUAL LENGTH. Every belief contributes exactly two events, whether it
#   is true or false. A false belief is settled in view and settled again
#   out of view; a true one is settled twice in view, the first sighting
#   superseded. Without this, event count alone would classify the
#   condition and a model could score well by counting rather than by
#   representing a belief.
#
# Generated from the stated mental states by scripts/add_histories.py, which
# guarantees entailment by construction. See notes/future_scenarios.md for
# what that costs.

history:
  - proposition:
      predicate: string
      subject: string
      object: string | null
      location: string | null
      value: boolean | string | number

    # Agent ids present when the event happened. Empty means nobody saw it.
    witnessed_by: [string]

    # Optional free-text label for readers; never sent to the model.
    event: string

# ---------------------------------------------------------------------------
# MENTAL STATE
# ---------------------------------------------------------------------------
# Explicit representations of agents' mental states.
#
# OMITTED from sparse representations.
# INCLUDED in rich representations.
#
# An agent's represented belief may conflict with objective world_state.
# This divergence is a primary experimental manipulation.
#
# Initial supported type:
#   belief
#
# Additional types (knowledge, uncertainty, preference, etc.) can be
# introduced later if required.

mental_state:
  - type: string
    agent: string

    proposition:
      predicate: string
      subject: string
      object: string | null
      location: string | null
      value: boolean | string | number

# A proposition may take another proposition as its content instead of a
# value. That is how second-order belief is written — the outer proposition
# attributes an attitude to an agent, the inner one says what that agent
# holds:
#
#   mental_state:
#     - type: belief
#       agent: sam
#       proposition:
#         predicate: believes
#         subject: alex
#         proposition:
#           predicate: located
#           subject: meeting
#           location: office
#           value: true
#
# Exactly one of `value` or a nested `proposition` must be given, at every
# level.
#
# Second-order beliefs are not treated as conflicting with world_state. A
# belief about another agent's belief makes no claim about the world: the
# nested belief may simply be wrong. So `world_conflict` reports false for
# such a scenario even when the nested belief contradicts the facts.

# ---------------------------------------------------------------------------
# QUESTION
# ---------------------------------------------------------------------------
# Decision Jev is asked to make. Two types:
#
#   goal               The action is observed, the goal is inferred.
#                      `observations` carries what the agent was seen doing;
#                      `goals` is omitted, since the goal is the answer.
#
#   action_prediction  The goal is given, the action is inferred.
#                      `goals` carries it, in both representations, so the
#                      reasoning task stays constant while representation
#                      richness changes.
#
# Options should be symmetric competing alternatives rather than an action
# and its negation — see notes/experimental_design.md.

question:
  type: goal | action_prediction
  agent: string

  # Candidate actions to which Jev assigns probabilities.
  options:
    - string

# ---------------------------------------------------------------------------
# GROUND TRUTH
# ---------------------------------------------------------------------------

ground_truth:
  # The single best answer. Must occur in `options`.
  answer: string

  # Optional. Every option that counts as correct, for scenarios that are
  # ambiguous by design — where the stimulus genuinely underdetermines the
  # answer and a spread distribution is the right response rather than a
  # failure. Must all occur in `options`, and must include `answer`.
  #
  # Omit it and it defaults to just `answer`. Utility then measures mass on
  # the whole set, and outcome tests membership in it, so distributing
  # probability among equally correct readings is neither gain nor loss.
  acceptable:
    - string

  # Researcher-facing explanation. Must NOT be supplied to Jev.
  explanation: string

# ---------------------------------------------------------------------------
# EXPERIMENTAL ANNOTATIONS
# ---------------------------------------------------------------------------
# Researcher metadata. Never supplied to Jev.

annotations:
  # Does the relevant objective world state support the target action?
  world_supports_action: boolean

  # Does the agent believe the relevant world state supports the action?
  agent_believes_action_supported: boolean

  # Does the agent's belief agree with objective reality?
  #
  # Presumes a single believer, and is ambiguous where a scenario
  # represents more than one. In the attribution set, one agent can be
  # wrong about another while that other is right about the world, and
  # this field cannot say which it means. Where two agents hold beliefs,
  # prefer the measured pair — analysis.world_conflict for belief against
  # world, analysis.attribution_conflict for belief against person.
  belief_matches_reality: boolean

  # Does representing the agent's belief change which action is expected?
  #
  # A claim of theoretical relevance, made a priori by the scenario
  # designer. It is not a prediction about the model: whether belief
  # actually moves Jev is measured rather than annotated, by the influence,
  # utility and correction measures in analysis.py.
  belief_changes_expected_action: boolean

  # Free-form analysis tags.
  tags:
    - string
