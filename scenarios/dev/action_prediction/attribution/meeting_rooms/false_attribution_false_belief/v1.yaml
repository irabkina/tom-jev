# Attribution scenario set — D. FALSE attribution, FALSE belief
#
# Sam wants to meet Alex, who is somewhere among three rooms. The set is a
# 2x2 over two independent questions:
#
#   attribution   does Sam's belief about Alex's belief match what Alex
#                 actually believes?
#   belief        does Alex's belief match the world?
#
# Ground truth is always where Sam believes Alex believes the meeting is:
# Sam acts on the belief Sam holds. What Alex actually believes, and where
# the meeting really is, are both unavailable to Sam and must not move the
# prediction of Sam's action — the rich representation states them anyway,
# so reading either as Sam's is a perspective error.
#
#   reality              conference room
#   Alex believes        garden
#   Sam believes Alex    office
#     believes
#
# All three diverge, and the errors are independent: Sam is wrong about
# Alex just as Alex is wrong about the world. Each of the three options is
# supported by a different fact in the state, and only one of them is the
# fact Sam holds. Predicting go_to_garden reads Alex's belief as Sam's;
# predicting go_to_conference_room ignores belief altogether.

id: attribution_false_attribution_false_belief
description: >
  Sam wants to meet Alex. The meeting is actually in the conference room.
  Alex believes it is in the garden. Sam believes that Alex believes it is
  in the office.

scenario_set: attribution

variant:
  type: false_attribution_false_belief

entities:
  agents:
    - id: sam
      name: Sam
    - id: alex
      name: Alex
  locations:
    - id: office
      name: office
    - id: conference_room
      name: conference room
    - id: garden
      name: garden
  objects:
    - id: meeting
      name: meeting

observations: []

world_state:
  - predicate: located
    subject: meeting
    location: office
    value: false

  - predicate: located
    subject: meeting
    location: conference_room
    value: true

  - predicate: located
    subject: meeting
    location: garden
    value: false

goals:
  - agent: sam
    type: meet
    target_agent: alex

# How the agent came to believe what they believe. The history entails the
# mental states below rather than restating them, so the `history`
# condition carries the evidence while `rich` carries the belief. Derived
# from the scenario by scripts/add_histories.py.
history:
  - proposition:
        predicate: believes
        subject: alex
        proposition:
          predicate: located
          subject: meeting
          location: office
          value: true
    witnessed_by:
      - sam

  - proposition:
        predicate: believes
        subject: alex
        proposition:
          predicate: located
          subject: meeting
          location: garden
          value: true
    witnessed_by: []

mental_state:
  - type: belief
    agent: sam
    proposition:
      predicate: believes
      subject: alex
      proposition:
        predicate: located
        subject: meeting
        location: office
        value: true

  - type: belief
    agent: alex
    proposition:
      predicate: located
      subject: meeting
      location: garden
      value: true

question:
  type: action_prediction
  agent: sam
  options:
    - go_to_office
    - go_to_conference_room
    - go_to_garden

ground_truth:
  answer: go_to_office
  explanation: >
    Sam expects to find Alex where Sam believes Alex thinks the meeting is,
    which is the office. That Alex actually believes the garden, and that
    the meeting is really in the conference room, are both unavailable to
    Sam and should not move the prediction of Sam's action.

annotations:
  world_supports_action: false
  agent_believes_action_supported: true
  belief_matches_reality: false
  belief_changes_expected_action: true
  tags:
    - nested_belief
    - attribution_error
    - social_prediction
    - belief_reality_mismatch
    - perspective_taking
    - rerepresentation_target
