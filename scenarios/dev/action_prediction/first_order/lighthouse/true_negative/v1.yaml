# lighthouse — first-order belief, true negative
#
# The keeper needs the fog-signal crank before the weather closes in.
#
# reality        engine shed
# belief         engine shed
#
# Belief and reality agree, so the world state alone suffices.

id: lighthouse_true_negative
description: >
  The keeper needs the fog-signal crank before the weather closes in. They
  believe it is in the engine shed.

scenario_set: lighthouse

variant:
  type: true_negative

entities:
  agents:
    - id: mira
      name: Mira

  locations:
    - id: lamp_room
      name: lamp room
    - id: engine_shed
      name: engine shed
    - id: boat_store
      name: boat store
    - id: cellar
      name: cellar

  objects:
    - id: crank
      name: fog-signal crank

observations: []

world_state:
  - predicate: located
    subject: crank
    location: lamp_room
    value: false

  - predicate: located
    subject: crank
    location: engine_shed
    value: true

  - predicate: located
    subject: crank
    location: boat_store
    value: false

  - predicate: located
    subject: crank
    location: cellar
    value: false

goals:
  - agent: mira
    type: obtain
    object: crank

# How the agent came to believe what they believe. The history entails the
# mental states below rather than restating them, so the `history`
# condition carries the evidence while `rich` carries the belief. Derived
# from the scenario by scripts/add_histories.py.
history:
  - proposition:
        predicate: located
        subject: crank
        location: lamp_room
        value: true
    witnessed_by:
      - mira

  - proposition:
        predicate: located
        subject: crank
        location: engine_shed
        value: true
    witnessed_by:
      - mira

mental_state:
  - type: belief
    agent: mira
    proposition:
      predicate: located
      subject: crank
      location: engine_shed
      value: true

question:
  type: action_prediction
  agent: mira
  options:
    - go_to_lamp_room
    - go_to_engine_shed
    - go_to_boat_store
    - go_to_cellar

ground_truth:
  answer: go_to_engine_shed
  explanation: >
    Mira believes the crank is in the engine shed and should go there.

annotations:
  world_supports_action: true
  agent_believes_action_supported: true
  belief_matches_reality: true
  belief_changes_expected_action: false
  tags:
    - first_order
    - belief_reality_match
    - control
