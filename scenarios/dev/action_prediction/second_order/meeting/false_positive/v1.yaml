id: meeting_false_positive
description: >
  Sam wants to meet Alex. The meeting is actually in the conference room,
  but Sam believes that Alex believes the meeting is in the office.

scenario_set: meeting

variant:
  type: false_positive

entities:
  agents:
    - id: sam
      name: Sam
    - id: alex
      name: Alex
  locations:
    - id: office
      name: office
    - id: conference_room
      name: conference room
  objects:
    - id: meeting
      name: meeting

observations: []

world_state:
  - predicate: located
    subject: meeting
    location: office
    value: false

  - predicate: located
    subject: meeting
    location: conference_room
    value: true

goals:
  - agent: sam
    type: meet
    target_agent: alex

# How the agent came to believe what they believe. The history entails the
# mental states below rather than restating them, so the `history`
# condition carries the evidence while `rich` carries the belief. Derived
# from the scenario by scripts/add_histories.py.
history:
  - proposition:
        predicate: believes
        subject: alex
        proposition:
          predicate: located
          subject: meeting
          location: conference_room
          value: true
    witnessed_by:
      - sam

  - proposition:
        predicate: believes
        subject: alex
        proposition:
          predicate: located
          subject: meeting
          location: office
          value: true
    witnessed_by:
      - sam

mental_state:
  - type: belief
    agent: sam
    proposition:
      predicate: believes
      subject: alex
      proposition:
        predicate: located
        subject: meeting
        location: office
        value: true

question:
  type: action_prediction
  agent: sam
  options:
    - go_to_office
    - go_to_conference_room

ground_truth:
  answer: go_to_office
  explanation: >
    Sam wants to meet Alex and believes that Alex believes the meeting is
    in the office. Sam therefore expects Alex to go to the office, despite
    the meeting actually being in the conference room.

annotations:
  world_supports_action: false
  agent_believes_action_supported: true
  belief_matches_reality: false
  belief_changes_expected_action: true
  tags:
    - nested_belief
    - social_prediction
    - belief_reality_mismatch
    - rerepresentation_target
