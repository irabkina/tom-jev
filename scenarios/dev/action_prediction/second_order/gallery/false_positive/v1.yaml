# gallery — second-order belief, false positive
#
# The curator wants to catch the artist before the doors open.
#
# reality                    print room
# Ilse believes Tavo believes  atrium
#
# Tavo's own belief is not represented, so the attribution cannot be
# wrong about Tavo — only about the world.

id: gallery_false_positive
description: >
  The curator wants to catch the artist before the doors open. Ilse
  believes Tavo expects it in the atrium.

scenario_set: gallery

variant:
  type: false_positive

entities:
  agents:
    - id: ilse
      name: Ilse
    - id: tavo
      name: Tavo

  locations:
    - id: atrium
      name: atrium
    - id: print_room
      name: print room
    - id: loading_bay
      name: loading bay
    - id: mezzanine
      name: mezzanine

  objects:
    - id: hanging
      name: hanging session

observations: []

world_state:
  - predicate: located
    subject: hanging
    location: atrium
    value: false

  - predicate: located
    subject: hanging
    location: print_room
    value: true

  - predicate: located
    subject: hanging
    location: loading_bay
    value: false

  - predicate: located
    subject: hanging
    location: mezzanine
    value: false

goals:
  - agent: ilse
    type: meet
    target_agent: tavo

# How the agent came to believe what they believe. The history entails the
# mental states below rather than restating them, so the `history`
# condition carries the evidence while `rich` carries the belief. Derived
# from the scenario by scripts/add_histories.py.
history:
  - proposition:
        predicate: believes
        subject: tavo
        proposition:
          predicate: located
          subject: hanging
          location: print_room
          value: true
    witnessed_by:
      - ilse

  - proposition:
        predicate: believes
        subject: tavo
        proposition:
          predicate: located
          subject: hanging
          location: atrium
          value: true
    witnessed_by:
      - ilse

mental_state:
  - type: belief
    agent: ilse
    proposition:
      predicate: believes
      subject: tavo
      proposition:
        predicate: located
        subject: hanging
        location: atrium
        value: true

question:
  type: action_prediction
  agent: ilse
  options:
    - go_to_atrium
    - go_to_print_room
    - go_to_loading_bay
    - go_to_mezzanine

ground_truth:
  answer: go_to_atrium
  explanation: >
    Ilse expects Tavo where Ilse believes Tavo thinks it is, the atrium,
    though it is actually in the print room.

annotations:
  world_supports_action: false
  agent_believes_action_supported: true
  belief_matches_reality: false
  belief_changes_expected_action: true
  tags:
    - nested_belief
    - social_prediction
    - belief_reality_mismatch
    - rerepresentation_target
