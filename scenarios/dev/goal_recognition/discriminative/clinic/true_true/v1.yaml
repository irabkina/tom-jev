# clinic — discriminative goal recognition, true true
#
# Devi is seen walking toward the dispensary.
#
# The world and the observation are constant across all four cells:
#   world         patient chart at the records room, Hale at the dispensary
#   observation   Devi walks toward the dispensary
#
# Only what the agent believes varies, over whether each belief matches
# the world. Whichever thing they believe is at the destination is the
# goal the walk serves, so belief can point somewhere the world does not.
#
#   Devi believes   patient chart at the records room, Hale at the dispensary
#
# Here the belief confirms the reading the world already gave.

id: clinic_true_true
description: >
  Devi is seen walking toward the dispensary. They believe patient chart
  is at the records room and Hale is at the dispensary.

scenario_set: clinic

variant:
  type: true_true

entities:
  agents:
    - id: devi
      name: Devi
    - id: hale
      name: Hale

  locations:
    - id: dispensary
      name: dispensary
    - id: records_room
      name: records room

  objects:
    - id: chart
      name: patient chart

observations:
  - type: walks_to
    agent: devi
    destination: dispensary

world_state:
  - predicate: located
    subject: chart
    location: records_room
    value: true

  - predicate: located
    subject: chart
    location: dispensary
    value: false

  - predicate: located
    subject: hale
    location: dispensary
    value: true

  - predicate: located
    subject: hale
    location: records_room
    value: false

# How the agent came to believe what they believe. The history entails the
# mental states below rather than restating them, so the `history`
# condition carries the evidence while `rich` carries the belief. Derived
# from the scenario by scripts/add_histories.py.
history:
  - proposition:
        predicate: located
        subject: chart
        location: dispensary
        value: true
    witnessed_by:
      - devi

  - proposition:
        predicate: located
        subject: chart
        location: records_room
        value: true
    witnessed_by:
      - devi

  - proposition:
        predicate: located
        subject: hale
        location: records_room
        value: true
    witnessed_by:
      - devi

  - proposition:
        predicate: located
        subject: hale
        location: dispensary
        value: true
    witnessed_by:
      - devi

mental_state:
  - type: belief
    agent: devi
    proposition:
      predicate: located
      subject: chart
      location: records_room
      value: true

  - type: belief
    agent: devi
    proposition:
      predicate: located
      subject: hale
      location: dispensary
      value: true

question:
  type: goal
  agent: devi
  options:
    - collect_chart
    - consult_hale

ground_truth:
  answer: consult_hale
  explanation: >
    Devi correctly believes Hale is at the dispensary and patient chart is
    not, so the walk is going to consult hale. The world licenses the same
    reading, so the belief adds nothing.

annotations:
  world_supports_action: true
  agent_believes_action_supported: true
  belief_matches_reality: true
  belief_changes_expected_action: false
  tags:
    - first_order
    - goal_recognition
    - discriminative
    - belief_reality_match
    - control
