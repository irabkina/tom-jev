# ferry — second-order belief, false negative
#
# The deckhand wants to find the pilot before the crossing starts.
#
# reality                    wheelhouse
# Noor believes Wen believes  galley
#
# Wen's own belief is not represented, so the attribution cannot be
# wrong about Wen — only about the world.

id: ferry_false_negative
description: >
  The deckhand wants to find the pilot before the crossing starts. Noor
  believes Wen expects it in the galley.

scenario_set: ferry

variant:
  type: false_negative

entities:
  agents:
    - id: noor
      name: Noor
    - id: wen
      name: Wen

  locations:
    - id: wheelhouse
      name: wheelhouse
    - id: galley
      name: galley
    - id: cargo_deck
      name: cargo deck

  objects:
    - id: briefing
      name: crew briefing

observations: []

world_state:
  - predicate: located
    subject: briefing
    location: wheelhouse
    value: true

  - predicate: located
    subject: briefing
    location: galley
    value: false

  - predicate: located
    subject: briefing
    location: cargo_deck
    value: false

goals:
  - agent: noor
    type: meet
    target_agent: wen

# How the agent came to believe what they believe. The history entails the
# mental states below rather than restating them, so the `history`
# condition carries the evidence while `rich` carries the belief. Derived
# from the scenario by scripts/add_histories.py.
history:
  - proposition:
        predicate: believes
        subject: wen
        proposition:
          predicate: located
          subject: briefing
          location: wheelhouse
          value: true
    witnessed_by:
      - noor

  - proposition:
        predicate: believes
        subject: wen
        proposition:
          predicate: located
          subject: briefing
          location: galley
          value: true
    witnessed_by:
      - noor

mental_state:
  - type: belief
    agent: noor
    proposition:
      predicate: believes
      subject: wen
      proposition:
        predicate: located
        subject: briefing
        location: galley
        value: true

question:
  type: action_prediction
  agent: noor
  options:
    - go_to_wheelhouse
    - go_to_galley
    - go_to_cargo_deck

ground_truth:
  answer: go_to_galley
  explanation: >
    Noor expects Wen where Noor believes Wen thinks it is, the galley,
    though it is actually in the wheelhouse.

annotations:
  world_supports_action: false
  agent_believes_action_supported: true
  belief_matches_reality: false
  belief_changes_expected_action: true
  tags:
    - nested_belief
    - social_prediction
    - belief_reality_mismatch
    - rerepresentation_target
