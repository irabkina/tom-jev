id: meeting_false_negative
description: >
  Sam wants to meet Alex. The meeting is actually in the office, but Sam
  believes that Alex believes the meeting is in the conference room.

scenario_set: meeting

variant:
  type: false_negative

entities:
  agents:
    - id: sam
      name: Sam
    - id: alex
      name: Alex
  locations:
    - id: office
      name: office
    - id: conference_room
      name: conference room
  objects:
    - id: meeting
      name: meeting

observations: []

world_state:
  - predicate: located
    subject: meeting
    location: office
    value: true

  - predicate: located
    subject: meeting
    location: conference_room
    value: false

goals:
  - agent: sam
    type: meet
    target_agent: alex

mental_state:
  - type: belief
    agent: sam
    proposition:
      predicate: believes
      subject: alex
      proposition:
        predicate: located
        subject: meeting
        location: conference_room
        value: true

question:
  type: action_prediction
  agent: sam
  options:
    - go_to_office
    - go_to_conference_room

ground_truth:
  answer: go_to_conference_room
  explanation: >
    Sam wants to meet Alex and believes that Alex believes the meeting is
    in the conference room. Sam therefore expects Alex to go to the
    conference room, despite the meeting actually being in the office.

annotations:
  world_supports_action: false
  agent_believes_action_supported: true
  belief_matches_reality: false
  belief_changes_expected_action: true
  tags:
    - nested_belief
    - social_prediction
    - belief_reality_mismatch
    - rerepresentation_target
