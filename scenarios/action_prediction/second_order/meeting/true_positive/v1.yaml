id: meeting_true_positive
description: >
  Sam wants to meet Alex. The meeting is in the office. Sam believes that
  Alex believes the meeting is in the office.

scenario_set: meeting

variant:
  type: true_positive

entities:
  agents:
    - id: sam
      name: Sam
    - id: alex
      name: Alex
  locations:
    - id: office
      name: office
    - id: conference_room
      name: conference room
  objects:
    - id: meeting
      name: meeting

observations: []

world_state:
  - predicate: located
    subject: meeting
    location: office
    value: true

  - predicate: located
    subject: meeting
    location: conference_room
    value: false

goals:
  - agent: sam
    type: meet
    target_agent: alex

mental_state:
  - type: belief
    agent: sam
    proposition:
      predicate: believes
      subject: alex
      proposition:
        predicate: located
        subject: meeting
        location: office
        value: true

question:
  type: action_prediction
  agent: sam
  options:
    - go_to_office
    - go_to_conference_room

ground_truth:
  answer: go_to_office
  explanation: >
    Sam wants to meet Alex and believes that Alex believes the meeting is
    in the office, so Sam expects Alex to go to the office.

annotations:
  world_supports_action: true
  agent_believes_action_supported: true
  belief_matches_reality: true
  belief_changes_expected_action: false
  tags:
    - nested_belief
    - social_prediction
    - belief_reality_match
    - control
