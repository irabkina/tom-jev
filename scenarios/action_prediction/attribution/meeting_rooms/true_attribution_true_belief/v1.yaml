# Attribution scenario set — A. TRUE attribution, TRUE belief
#
# Sam wants to meet Alex, who is somewhere among three rooms. The set is a
# 2x2 over two independent questions:
#
#   attribution   does Sam's belief about Alex's belief match what Alex
#                 actually believes?
#   belief        does Alex's belief match the world?
#
# Ground truth is always where Sam believes Alex believes the meeting is:
# Sam acts on the belief Sam holds. What Alex actually believes, and where
# the meeting really is, are both unavailable to Sam and must not move the
# prediction of Sam's action — the rich representation states them anyway,
# so reading either as Sam's is a perspective error.
#
#   reality              office
#   Alex believes        office
#   Sam believes Alex    office
#     believes
#
# Everything agrees. The control cell: belief adds nothing the world state
# did not already give.

id: attribution_true_attribution_true_belief
description: >
  Sam wants to meet Alex. The meeting is in the office, Alex believes it
  is in the office, and Sam believes that Alex believes it is in the
  office.

scenario_set: attribution

variant:
  type: true_attribution_true_belief

entities:
  agents:
    - id: sam
      name: Sam
    - id: alex
      name: Alex
  locations:
    - id: office
      name: office
    - id: conference_room
      name: conference room
    - id: garden
      name: garden
  objects:
    - id: meeting
      name: meeting

observations: []

world_state:
  - predicate: located
    subject: meeting
    location: office
    value: true

  - predicate: located
    subject: meeting
    location: conference_room
    value: false

  - predicate: located
    subject: meeting
    location: garden
    value: false
  # Where Alex actually is. Alex acts on Alex's own belief, so this
  # follows from it — and without it the world says nothing about the
  # goal's target, which is what Sam is trying to reach.
  - predicate: located
    subject: alex
    location: office
    value: true

  - predicate: located
    subject: alex
    location: conference_room
    value: false

  - predicate: located
    subject: alex
    location: garden
    value: false

goals:
  - agent: sam
    type: meet
    target_agent: alex

mental_state:
  - type: belief
    agent: sam
    proposition:
      predicate: believes
      subject: alex
      proposition:
        predicate: located
        subject: meeting
        location: office
        value: true

  - type: belief
    agent: alex
    proposition:
      predicate: located
      subject: meeting
      location: office
      value: true

question:
  type: action_prediction
  agent: sam
  options:
    - go_to_office
    - go_to_conference_room
    - go_to_garden

ground_truth:
  answer: go_to_office
  explanation: >
    Sam expects Alex where Sam believes Alex thinks the meeting is. Here
    that matches both Alex's actual belief and the world, so every route
    to the answer agrees.

annotations:
  world_supports_action: true
  agent_believes_action_supported: true
  belief_matches_reality: true
  belief_changes_expected_action: false
  tags:
    - nested_belief
    - social_prediction
    - perspective_taking
    - belief_reality_match
    - control
