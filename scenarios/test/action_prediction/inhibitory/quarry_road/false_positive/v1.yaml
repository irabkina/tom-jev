# quarry_road — inhibitory action prediction, false positive
#
# Idris has to fetch the load from the crusher. The haul road is the
# direct way and three bypasses all reach the same place. What varies is
# whether he takes the haul road to be passable.
#
# All three bypasses are passable in every cell and nothing
# distinguishes them, so a denial of the haul road licenses all three
# equally and no answer is determined. Idris holds exactly one belief in
# every cell. Where that belief denies, the acceptable set is the three
# bypasses and entropy is the measure that carries information;
# `outcome` cannot fail.

id: quarry_road_false_positive
description: >
  The haul road is shut, but Idris believes it open and sets off down
  it. Here the belief still determines an answer, because believing a
  way is open names that way.

scenario_set: quarry_road

variant:
  type: false_positive

entities:
  agents:
    - id: idris
      name: Idris

  locations:
    - id: haul_road
      name: haul road
    - id: west_bypass
      name: west bypass
    - id: river_track
      name: river track
    - id: ridge_cut
      name: ridge cut
    - id: crusher
      name: crusher

  objects:
    - id: load
      name: load

observations: []

world_state:
  - predicate: available
    subject: haul_road
    value: false

  - predicate: available
    subject: west_bypass
    value: true

  - predicate: available
    subject: river_track
    value: true

  - predicate: available
    subject: ridge_cut
    value: true

  - predicate: direct
    subject: haul_road
    value: true

  - predicate: located
    subject: load
    location: crusher
    value: true

goals:
  - agent: idris
    type: obtain
    object: load

# How the agent came to believe what they believe. The history entails the
# mental states below rather than restating them, so the `history`
# condition carries the evidence while `rich` carries the belief. Derived
# from the scenario by scripts/add_histories.py.
history:
  - proposition:
        predicate: available
        subject: haul_road
        value: true
    witnessed_by:
      - idris

  - proposition:
        predicate: available
        subject: haul_road
        value: false
    witnessed_by: []

mental_state:
  - type: belief
    agent: idris
    proposition:
      predicate: available
      subject: haul_road
      value: true

question:
  type: action_prediction
  agent: idris
  options:
    - take_the_haul_road
    - take_the_west_bypass
    - take_the_river_track
    - take_the_ridge_cut

ground_truth:
  answer: take_the_haul_road
  explanation: >
    The haul road is shut, but Idris believes it open and sets off down
    it. Here the belief still determines an answer, because believing a
    way is open names that way.

annotations:
  world_supports_action: false
  agent_believes_action_supported: true
  belief_matches_reality: false
  belief_changes_expected_action: true
  tags:
    - action_prediction
    - inhibitory
    - access_belief
    - denial_only
    - ambiguous_by_design
