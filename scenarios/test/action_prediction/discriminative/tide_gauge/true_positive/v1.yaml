# tide_gauge — discriminative action prediction, true positive
#
# Marta has to log the tide before the turn, and the hut holds four
# instruments. Nothing is mislaid and nothing is hidden: what varies is
# which instrument she takes to be serviceable.
#
# Exactly one instrument works. Marta holds two beliefs in every cell,
# one about the float gauge and one about the radar head. The target
# action throughout is using the float gauge.

id: tide_gauge_true_positive
description: >
  The float gauge works and Marta believes it does, so she uses it.
  Belief and world agree.

scenario_set: tide_gauge

variant:
  type: true_positive

entities:
  agents:
    - id: marta
      name: Marta

  locations:
    - id: gauge_hut
      name: gauge hut

  objects:
    - id: float_gauge
      name: float gauge
    - id: pressure_sensor
      name: pressure sensor
    - id: staff_board
      name: staff board
    - id: radar_head
      name: radar head
    - id: reading
      name: reading

observations: []

world_state:
  - predicate: available
    subject: float_gauge
    location: gauge_hut
    value: true

  - predicate: available
    subject: pressure_sensor
    location: gauge_hut
    value: false

  - predicate: available
    subject: staff_board
    location: gauge_hut
    value: false

  - predicate: available
    subject: radar_head
    location: gauge_hut
    value: false

goals:
  - agent: marta
    type: obtain
    object: reading

# How the agent came to believe what they believe. The history entails the
# mental states below rather than restating them, so the `history`
# condition carries the evidence while `rich` carries the belief. Derived
# from the scenario by scripts/add_histories.py.
history:
  - proposition:
        predicate: available
        subject: float_gauge
        location: gauge_hut
        value: false
    witnessed_by:
      - marta

  - proposition:
        predicate: available
        subject: float_gauge
        location: gauge_hut
        value: true
    witnessed_by:
      - marta

  - proposition:
        predicate: available
        subject: radar_head
        location: gauge_hut
        value: true
    witnessed_by:
      - marta

  - proposition:
        predicate: available
        subject: radar_head
        location: gauge_hut
        value: false
    witnessed_by:
      - marta

mental_state:
  - type: belief
    agent: marta
    proposition:
      predicate: available
      subject: float_gauge
      location: gauge_hut
      value: true

  - type: belief
    agent: marta
    proposition:
      predicate: available
      subject: radar_head
      location: gauge_hut
      value: false

question:
  type: action_prediction
  agent: marta
  options:
    - use_the_float_gauge
    - use_the_pressure_sensor
    - use_the_staff_board
    - use_the_radar_head

ground_truth:
  answer: use_the_float_gauge
  explanation: >
    The float gauge works and Marta believes it does, so she uses it.
    Belief and world agree.

annotations:
  world_supports_action: true
  agent_believes_action_supported: true
  belief_matches_reality: true
  belief_changes_expected_action: false
  tags:
    - action_prediction
    - discriminative
    - fitness_belief
    - rerepresentation_target
