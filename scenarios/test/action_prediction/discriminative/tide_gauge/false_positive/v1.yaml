# tide_gauge — discriminative action prediction, false positive
#
# Marta has to log the tide before the turn, and the hut holds four
# instruments. Nothing is mislaid and nothing is hidden: what varies is
# which instrument she takes to be serviceable.
#
# Exactly one instrument works. Marta holds two beliefs in every cell,
# one about the float gauge and one about the radar head. The target
# action throughout is using the float gauge.

id: tide_gauge_false_positive
description: >
  Marta believes the float gauge is serviceable and reaches for it,
  though it is the pressure sensor that works. The belief names an
  instrument, so it designates rather than merely rules out.

scenario_set: tide_gauge

variant:
  type: false_positive

entities:
  agents:
    - id: marta
      name: Marta

  locations:
    - id: gauge_hut
      name: gauge hut

  objects:
    - id: float_gauge
      name: float gauge
    - id: pressure_sensor
      name: pressure sensor
    - id: staff_board
      name: staff board
    - id: radar_head
      name: radar head
    - id: reading
      name: reading

observations: []

world_state:
  - predicate: available
    subject: float_gauge
    location: gauge_hut
    value: false

  - predicate: available
    subject: pressure_sensor
    location: gauge_hut
    value: true

  - predicate: available
    subject: staff_board
    location: gauge_hut
    value: false

  - predicate: available
    subject: radar_head
    location: gauge_hut
    value: false

goals:
  - agent: marta
    type: obtain
    object: reading

# How the agent came to believe what they believe. The history entails the
# mental states below rather than restating them, so the `history`
# condition carries the evidence while `rich` carries the belief. Derived
# from the scenario by scripts/add_histories.py.
history:
  - proposition:
        predicate: available
        subject: float_gauge
        location: gauge_hut
        value: true
    witnessed_by:
      - marta

  - proposition:
        predicate: available
        subject: float_gauge
        location: gauge_hut
        value: false
    witnessed_by: []

  - proposition:
        predicate: available
        subject: radar_head
        location: gauge_hut
        value: true
    witnessed_by:
      - marta

  - proposition:
        predicate: available
        subject: radar_head
        location: gauge_hut
        value: false
    witnessed_by:
      - marta

mental_state:
  - type: belief
    agent: marta
    proposition:
      predicate: available
      subject: float_gauge
      location: gauge_hut
      value: true

  - type: belief
    agent: marta
    proposition:
      predicate: available
      subject: radar_head
      location: gauge_hut
      value: false

question:
  type: action_prediction
  agent: marta
  options:
    - use_the_float_gauge
    - use_the_pressure_sensor
    - use_the_staff_board
    - use_the_radar_head

ground_truth:
  answer: use_the_float_gauge
  explanation: >
    Marta believes the float gauge is serviceable and reaches for it,
    though it is the pressure sensor that works. The belief names an
    instrument, so it designates rather than merely rules out.

annotations:
  world_supports_action: false
  agent_believes_action_supported: true
  belief_matches_reality: false
  belief_changes_expected_action: true
  tags:
    - action_prediction
    - discriminative
    - fitness_belief
    - rerepresentation_target
