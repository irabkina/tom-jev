# archive_desk — inhibitory goal recognition, false positive
#
# Perrin is seen walking into the reading room. He may be after the
# ledger, or the archivist, or returning the plates, or collecting the
# transfer list.
#
# Perrin holds exactly one belief in every cell, about the ledger.
# Affirming it names an errand; denying it removes one and names no
# other, leaving three that nothing he believes chooses between. He
# never learns where anything else is, so a denial costs the reading
# whatever the world happens to know.

id: archive_desk_false_positive
description: >
  The ledger is in the stack and the archivist is in the reading room,
  but Perrin believes the ledger is there and is walking in for it.
  Believing a thing is somewhere names an errand, so this cell has a
  determinate answer even though the set is otherwise inhibitory.

scenario_set: archive_desk

variant:
  type: false_positive

entities:
  agents:
    - id: perrin
      name: Perrin
    - id: archivist
      name: the archivist

  locations:
    - id: reading_room
      name: reading room
    - id: stack
      name: stack

  objects:
    - id: ledger
      name: ledger
    - id: plates
      name: plates
    - id: transfer_list
      name: transfer list

observations:
  - type: walks_to
    agent: perrin
    destination: reading_room

world_state:
  - predicate: located
    subject: ledger
    location: reading_room
    value: false

  - predicate: located
    subject: ledger
    location: stack
    value: true

  - predicate: located
    subject: archivist
    location: reading_room
    value: true

  - predicate: located
    subject: archivist
    location: stack
    value: false

  - predicate: located
    subject: plates
    location: reading_room
    value: false

  - predicate: located
    subject: plates
    location: stack
    value: true

  - predicate: located
    subject: transfer_list
    location: reading_room
    value: false

  - predicate: located
    subject: transfer_list
    location: stack
    value: true

# How the agent came to believe what they believe. The history entails the
# mental states below rather than restating them, so the `history`
# condition carries the evidence while `rich` carries the belief. Derived
# from the scenario by scripts/add_histories.py.
history:
  - proposition:
        predicate: located
        subject: ledger
        location: reading_room
        value: true
    witnessed_by:
      - perrin

  - proposition:
        predicate: located
        subject: ledger
        location: stack
        value: true
    witnessed_by: []

mental_state:
  - type: belief
    agent: perrin
    proposition:
      predicate: located
      subject: ledger
      location: reading_room
      value: true

question:
  type: goal
  agent: perrin
  options:
    - fetch_the_ledger
    - meet_the_archivist
    - return_the_plates
    - collect_the_transfer_list

ground_truth:
  answer: fetch_the_ledger
  explanation: >
    The ledger is in the stack and the archivist is in the reading room,
    but Perrin believes the ledger is there and is walking in for it.
    Believing a thing is somewhere names an errand, so this cell has a
    determinate answer even though the set is otherwise inhibitory.

annotations:
  world_supports_action: false
  agent_believes_action_supported: true
  belief_matches_reality: false
  belief_changes_expected_action: true
  tags:
    - goal_recognition
    - inhibitory
    - presence_belief
    - denial_only
    - ambiguous_by_design
