# archive_desk — inhibitory goal recognition, false negative
#
# Perrin is seen walking into the reading room. He may be after the
# ledger, or the archivist, or returning the plates, or collecting the
# transfer list.
#
# Perrin holds exactly one belief in every cell, about the ledger.
# Affirming it names an errand; denying it removes one and names no
# other, leaving three that nothing he believes chooses between. He
# never learns where anything else is, so a denial costs the reading
# whatever the world happens to know.
#
# The cell that can punish escalation: the world gives a confident and
# correct reading, and representing the belief takes it away without
# offering a replacement.

id: archive_desk_false_negative
description: >
  The ledger is in the reading room, but Perrin believes it is not. That
  removes the errand the world supports and names no other, so the
  remaining three are equally acceptable.

scenario_set: archive_desk

variant:
  type: false_negative

entities:
  agents:
    - id: perrin
      name: Perrin
    - id: archivist
      name: the archivist

  locations:
    - id: reading_room
      name: reading room
    - id: stack
      name: stack

  objects:
    - id: ledger
      name: ledger
    - id: plates
      name: plates
    - id: transfer_list
      name: transfer list

observations:
  - type: walks_to
    agent: perrin
    destination: reading_room

world_state:
  - predicate: located
    subject: ledger
    location: reading_room
    value: true

  - predicate: located
    subject: ledger
    location: stack
    value: false

  - predicate: located
    subject: archivist
    location: reading_room
    value: false

  - predicate: located
    subject: archivist
    location: stack
    value: true

  - predicate: located
    subject: plates
    location: reading_room
    value: false

  - predicate: located
    subject: plates
    location: stack
    value: true

  - predicate: located
    subject: transfer_list
    location: reading_room
    value: false

  - predicate: located
    subject: transfer_list
    location: stack
    value: true

# How the agent came to believe what they believe. The history entails the
# mental states below rather than restating them, so the `history`
# condition carries the evidence while `rich` carries the belief. Derived
# from the scenario by scripts/add_histories.py.
history:
  - proposition:
        predicate: located
        subject: ledger
        location: reading_room
        value: false
    witnessed_by:
      - perrin

  - proposition:
        predicate: located
        subject: ledger
        location: reading_room
        value: true
    witnessed_by: []

mental_state:
  - type: belief
    agent: perrin
    proposition:
      predicate: located
      subject: ledger
      location: reading_room
      value: false

question:
  type: goal
  agent: perrin
  options:
    - fetch_the_ledger
    - meet_the_archivist
    - return_the_plates
    - collect_the_transfer_list

ground_truth:
  answer: meet_the_archivist
  acceptable:
    - meet_the_archivist
    - return_the_plates
    - collect_the_transfer_list
  explanation: >
    The ledger is in the reading room, but Perrin believes it is not.
    That removes the errand the world supports and names no other, so
    the remaining three are equally acceptable.

annotations:
  world_supports_action: true
  agent_believes_action_supported: false
  belief_matches_reality: false
  belief_changes_expected_action: true
  tags:
    - goal_recognition
    - inhibitory
    - presence_belief
    - denial_only
    - ambiguous_by_design
