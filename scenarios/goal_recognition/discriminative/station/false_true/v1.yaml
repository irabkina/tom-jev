# station — discriminative goal recognition, false true
#
# Rowan is seen walking toward platform three.
#
# The world and the observation are constant across all four cells:
#   world         bicycle at the left-luggage office, Amara at the platform three
#   observation   Rowan walks toward the platform three
#
# Only what the agent believes varies, over whether each belief matches
# the world. Whichever thing they believe is at the destination is the
# goal the walk serves, so belief can point somewhere the world does not.
#
#   Rowan believes   bicycle at the platform three, Amara at the platform three
#
# Here the belief adds a second, equally good reading.
#
# Both options are acceptable, so `outcome` cannot fail and carries no
# information. Entropy is the measure that does.

id: station_false_true
description: >
  Rowan is seen walking toward platform three. They believe bicycle is at
  the platform three and Amara is at the platform three.

scenario_set: station

variant:
  type: false_true

entities:
  agents:
    - id: rowan
      name: Rowan
    - id: amara
      name: Amara

  locations:
    - id: platform_three
      name: platform three
      article: false
      preposition: at
    - id: left_luggage
      name: left-luggage office

  objects:
    - id: bicycle
      name: bicycle

observations:
  - type: walks_to
    agent: rowan
    destination: platform_three

world_state:
  - predicate: located
    subject: bicycle
    location: left_luggage
    value: true

  - predicate: located
    subject: bicycle
    location: platform_three
    value: false

  - predicate: located
    subject: amara
    location: platform_three
    value: true

  - predicate: located
    subject: amara
    location: left_luggage
    value: false

# How the agent came to believe what they believe. The history entails the
# mental states below rather than restating them, so the `history`
# condition carries the evidence while `rich` carries the belief. Derived
# from the scenario by scripts/add_histories.py.
history:
  - proposition:
        predicate: located
        subject: bicycle
        location: platform_three
        value: true
    witnessed_by:
      - rowan

  - proposition:
        predicate: located
        subject: bicycle
        location: left_luggage
        value: true
    witnessed_by: []

  - proposition:
        predicate: located
        subject: amara
        location: left_luggage
        value: true
    witnessed_by:
      - rowan

  - proposition:
        predicate: located
        subject: amara
        location: platform_three
        value: true
    witnessed_by:
      - rowan

mental_state:
  - type: belief
    agent: rowan
    proposition:
      predicate: located
      subject: bicycle
      location: platform_three
      value: true

  - type: belief
    agent: rowan
    proposition:
      predicate: located
      subject: amara
      location: platform_three
      value: true

question:
  type: goal
  agent: rowan
  options:
    - retrieve_bicycle
    - find_amara

ground_truth:
  answer: find_amara
  acceptable:
    - find_amara
    - retrieve_bicycle
  explanation: >
    Rowan believes both bicycle and Amara are at the platform three, so
    either goal explains the walk and nothing distinguishes them. The
    ambiguity is the point.

annotations:
  world_supports_action: false
  agent_believes_action_supported: true
  belief_matches_reality: false
  belief_changes_expected_action: true
  tags:
    - first_order
    - goal_recognition
    - discriminative
    - ambiguous_by_design
    - belief_adds_ambiguity
