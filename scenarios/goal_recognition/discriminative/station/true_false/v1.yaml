# station — discriminative goal recognition, true false
#
# Rowan is seen walking toward platform three.
#
# The world and the observation are constant across all four cells:
#   world         bicycle at the left-luggage office, Amara at the platform three
#   observation   Rowan walks toward the platform three
#
# Only what the agent believes varies, over whether each belief matches
# the world. Whichever thing they believe is at the destination is the
# goal the walk serves, so belief can point somewhere the world does not.
#
#   Rowan believes   bicycle at the left-luggage office, Amara at the left-luggage office
#
# Here the belief removes that reading without offering another.
#
# Both options are acceptable, so `outcome` cannot fail and carries no
# information. Entropy is the measure that does.

id: station_true_false
description: >
  Rowan is seen walking toward platform three. They believe bicycle is at
  the left-luggage office and Amara is at the left-luggage office.

scenario_set: station

variant:
  type: true_false

entities:
  agents:
    - id: rowan
      name: Rowan
    - id: amara
      name: Amara

  locations:
    - id: platform_three
      name: platform three
    - id: left_luggage
      name: left-luggage office

  objects:
    - id: bicycle
      name: bicycle

observations:
  - type: walks_to
    agent: rowan
    destination: platform_three

world_state:
  - predicate: located
    subject: bicycle
    location: left_luggage
    value: true

  - predicate: located
    subject: bicycle
    location: platform_three
    value: false

  - predicate: located
    subject: amara
    location: platform_three
    value: true

  - predicate: located
    subject: amara
    location: left_luggage
    value: false

mental_state:
  - type: belief
    agent: rowan
    proposition:
      predicate: located
      subject: bicycle
      location: left_luggage
      value: true

  - type: belief
    agent: rowan
    proposition:
      predicate: located
      subject: amara
      location: left_luggage
      value: true

question:
  type: goal
  agent: rowan
  options:
    - retrieve_bicycle
    - find_amara

ground_truth:
  answer: find_amara
  acceptable:
    - find_amara
    - retrieve_bicycle
  explanation: >
    On their own beliefs neither bicycle nor Amara is at the platform
    three, so neither goal explains the walk. No answer is licensed and
    both are acceptable; what matters is whether the richer representation
    registers the anomaly by becoming less certain.

annotations:
  world_supports_action: false
  agent_believes_action_supported: true
  belief_matches_reality: false
  belief_changes_expected_action: true
  tags:
    - first_order
    - goal_recognition
    - discriminative
    - ambiguous_by_design
    - anomalous_observation
