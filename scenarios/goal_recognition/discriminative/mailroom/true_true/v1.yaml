# mailroom — discriminative goal recognition, TRUE package / TRUE Alex
#
# Sam is seen walking toward the front desk. Why?
#
# The world and the observation are constant across all four cells:
#
#   world          package at the mailroom, Alex at the front desk
#   observation    Sam walks toward the front desk
#
# Only what Sam believes varies, over two axes: whether Sam's belief about
# the package matches the world, and whether Sam's belief about Alex does.
#
#   Sam believes   package at the mailroom, Alex at the front desk
#
# Both beliefs are correct, so belief and world agree and the walk reads
# the same either way: Alex is at the front desk, so Sam is going to meet
# Alex. The control cell — re-representation should change nothing, and a
# large influence here would mean the rich representation is doing
# something other than supplying the belief.

id: mailroom_true_true
description: >
  Sam walks toward the front desk. The package is in the mailroom and Alex
  is at the front desk, and Sam correctly believes both.

scenario_set: mailroom

variant:
  type: true_true

entities:
  agents:
    - id: sam
      name: Sam
    - id: alex
      name: Alex
  locations:
    - id: front_desk
      name: front desk
      article: true
      preposition: at
    - id: mailroom
      name: mailroom
  objects:
    - id: package
      name: package

observations:
  - type: walks_to
    agent: sam
    destination: front_desk

world_state:
  - predicate: located
    subject: package
    location: mailroom
    value: true

  - predicate: located
    subject: package
    location: front_desk
    value: false

  - predicate: located
    subject: alex
    location: front_desk
    value: true

  - predicate: located
    subject: alex
    location: mailroom
    value: false

# How the agent came to believe what they believe. The history entails the
# mental states below rather than restating them, so the `history`
# condition carries the evidence while `rich` carries the belief. Derived
# from the scenario by scripts/add_histories.py.
history:
  - proposition:
        predicate: located
        subject: package
        location: front_desk
        value: true
    witnessed_by:
      - sam

  - proposition:
        predicate: located
        subject: package
        location: mailroom
        value: true
    witnessed_by:
      - sam

  - proposition:
        predicate: located
        subject: alex
        location: mailroom
        value: true
    witnessed_by:
      - sam

  - proposition:
        predicate: located
        subject: alex
        location: front_desk
        value: true
    witnessed_by:
      - sam

mental_state:
  - type: belief
    agent: sam
    proposition:
      predicate: located
      subject: package
      location: mailroom
      value: true

  - type: belief
    agent: sam
    proposition:
      predicate: located
      subject: alex
      location: front_desk
      value: true

question:
  type: goal
  agent: sam
  options:
    - pick_up_package
    - meet_alex

ground_truth:
  answer: meet_alex
  explanation: >
    Sam correctly believes the package is in the mailroom and Alex is at
    the front desk, so walking to the front desk is Sam going to meet Alex.
    The world state licenses the same reading, so the belief adds nothing.

annotations:
  world_supports_action: true
  agent_believes_action_supported: true
  belief_matches_reality: true
  belief_changes_expected_action: false
  tags:
    - first_order
    - goal_recognition
    - discriminative
    - belief_reality_match
    - control
