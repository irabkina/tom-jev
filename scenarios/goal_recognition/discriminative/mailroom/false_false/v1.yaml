# mailroom — discriminative goal recognition, FALSE package / FALSE Alex
#
# Sam is seen walking toward the front desk. Why?
#
# The world and the observation are constant across all four cells:
#
#   world          package at the mailroom, Alex at the front desk
#   observation    Sam walks toward the front desk
#
# Only what Sam believes varies, over two axes: whether Sam's belief about
# the package matches the world, and whether Sam's belief about Alex does.
#
# Unlike the other goal-recognition domains, belief here does not merely
# subtract a goal and leave a remainder. Whichever thing Sam believes is at
# the front desk is the goal the walk serves, so belief can point somewhere
# the world does not — which is what makes the two representations
# separable rather than one simply outweighing the other.
#
#   Sam believes   package at the front desk, Alex at the mailroom
#
# Both beliefs are wrong, and wrong in a way that swaps the two locations.
# From the world alone the walk reads as going to meet Alex, who really is
# at the front desk. Adding Sam's belief redirects it to the package.

id: mailroom_false_false
description: >
  Sam walks toward the front desk. The package is actually in the mailroom
  and Alex is actually at the front desk, but Sam believes the package is
  at the front desk and that Alex is in the mailroom.

scenario_set: mailroom

variant:
  type: false_false

entities:
  agents:
    - id: sam
      name: Sam
    - id: alex
      name: Alex
  locations:
    - id: front_desk
      name: front desk
      article: true
      preposition: at
    - id: mailroom
      name: mailroom
  objects:
    - id: package
      name: package

observations:
  - type: walks_to
    agent: sam
    destination: front_desk

world_state:
  - predicate: located
    subject: package
    location: mailroom
    value: true

  - predicate: located
    subject: package
    location: front_desk
    value: false

  - predicate: located
    subject: alex
    location: front_desk
    value: true

  - predicate: located
    subject: alex
    location: mailroom
    value: false

# How the agent came to believe what they believe. The history entails the
# mental states below rather than restating them, so the `history`
# condition carries the evidence while `rich` carries the belief. Derived
# from the scenario by scripts/add_histories.py.
history:
  - proposition:
        predicate: located
        subject: package
        location: front_desk
        value: true
    witnessed_by:
      - sam

  - proposition:
        predicate: located
        subject: package
        location: mailroom
        value: true
    witnessed_by: []

  - proposition:
        predicate: located
        subject: alex
        location: mailroom
        value: true
    witnessed_by:
      - sam

  - proposition:
        predicate: located
        subject: alex
        location: front_desk
        value: true
    witnessed_by: []

mental_state:
  - type: belief
    agent: sam
    proposition:
      predicate: located
      subject: package
      location: front_desk
      value: true

  - type: belief
    agent: sam
    proposition:
      predicate: located
      subject: alex
      location: mailroom
      value: true

question:
  type: goal
  agent: sam
  options:
    - pick_up_package
    - meet_alex

ground_truth:
  answer: pick_up_package
  explanation: >
    Sam acts on what Sam believes. Sam thinks the package is at the front
    desk and that Alex is in the mailroom, so walking to the front desk is
    Sam going to collect the package. The world state points the other way
    — Alex really is at the front desk and the package is not — which is
    exactly what makes the two representations separable here.

annotations:
  world_supports_action: false
  agent_believes_action_supported: true
  belief_matches_reality: false
  belief_changes_expected_action: true
  tags:
    - first_order
    - goal_recognition
    - discriminative
    - belief_redirects
    - belief_reality_mismatch
    - rerepresentation_target
