# workshop — discriminative goal recognition, false true
#
# Kira is seen walking toward the paint booth.
#
# The world and the observation are constant across all four cells:
#   world         respirator at the storeroom, Nils at the paint booth
#   observation   Kira walks toward the paint booth
#
# Only what the agent believes varies, over whether each belief matches
# the world. Whichever thing they believe is at the destination is the
# goal the walk serves, so belief can point somewhere the world does not.
#
#   Kira believes   respirator at the paint booth, Nils at the paint booth
#
# Here the belief adds a second, equally good reading.
#
# Both options are acceptable, so `outcome` cannot fail and carries no
# information. Entropy is the measure that does.

id: workshop_false_true
description: >
  Kira is seen walking toward the paint booth. They believe respirator is
  at the paint booth and Nils is at the paint booth.

scenario_set: workshop

variant:
  type: false_true

entities:
  agents:
    - id: kira
      name: Kira
    - id: nils
      name: Nils

  locations:
    - id: paint_booth
      name: paint booth
    - id: storeroom
      name: storeroom

  objects:
    - id: respirator
      name: respirator

observations:
  - type: walks_to
    agent: kira
    destination: paint_booth

world_state:
  - predicate: located
    subject: respirator
    location: storeroom
    value: true

  - predicate: located
    subject: respirator
    location: paint_booth
    value: false

  - predicate: located
    subject: nils
    location: paint_booth
    value: true

  - predicate: located
    subject: nils
    location: storeroom
    value: false

# How the agent came to believe what they believe. The history entails the
# mental states below rather than restating them, so the `history`
# condition carries the evidence while `rich` carries the belief. Derived
# from the scenario by scripts/add_histories.py.
history:
  - proposition:
        predicate: located
        subject: respirator
        location: paint_booth
        value: true
    witnessed_by:
      - kira

  - proposition:
        predicate: located
        subject: respirator
        location: storeroom
        value: true
    witnessed_by: []

  - proposition:
        predicate: located
        subject: nils
        location: storeroom
        value: true
    witnessed_by:
      - kira

  - proposition:
        predicate: located
        subject: nils
        location: paint_booth
        value: true
    witnessed_by:
      - kira

mental_state:
  - type: belief
    agent: kira
    proposition:
      predicate: located
      subject: respirator
      location: paint_booth
      value: true

  - type: belief
    agent: kira
    proposition:
      predicate: located
      subject: nils
      location: paint_booth
      value: true

question:
  type: goal
  agent: kira
  options:
    - fetch_respirator
    - consult_nils

ground_truth:
  answer: consult_nils
  acceptable:
    - consult_nils
    - fetch_respirator
  explanation: >
    Kira believes both respirator and Nils are at the paint booth, so
    either goal explains the walk and nothing distinguishes them. The
    ambiguity is the point.

annotations:
  world_supports_action: false
  agent_believes_action_supported: true
  belief_matches_reality: false
  belief_changes_expected_action: true
  tags:
    - first_order
    - goal_recognition
    - discriminative
    - ambiguous_by_design
    - belief_adds_ambiguity
