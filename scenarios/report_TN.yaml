# Report scenario set — D. TRUE NEGATIVE
#
# Sam wants to retrieve a report, which is in one of two rooms.
# Across all four conditions Sam has the same goal and the same two
# candidate destinations. Only the report's actual location and Sam's
# belief about it vary.
#
# Reality: report in the conference room
# Belief:  report not in the office
#
# Reality and belief agree, so acting on either leads to the same place.

id: report_true_negative
description: >
  Sam wants to retrieve a report. The report is in the conference room,
  and Sam correctly believes that the report is not in the office.

scenario_set: report

variant:
  type: true_negative

entities:
  agents:
    - id: sam
      name: Sam
  locations:
    - id: office
      name: office
    - id: conference_room
      name: conference room
  objects:
    - id: report
      name: report

observations: []

world_state:
  - predicate: located
    subject: report
    location: office
    value: false

  - predicate: located
    subject: report
    location: conference_room
    value: true

goals:
  - agent: sam
    type: obtain
    object: report

mental_state:
  - type: belief
    agent: sam
    proposition:
      predicate: located
      subject: report
      location: office
      value: false

question:
  type: action_prediction
  agent: sam
  options:
    - go_to_office
    - go_to_conference_room

ground_truth:
  answer: go_to_conference_room
  explanation: >
    Sam correctly believes the report is not in the office, so Sam should
    go to the conference room, where the report actually is.

annotations:
  world_supports_action: true
  agent_believes_action_supported: true
  belief_matches_reality: true
  belief_changes_expected_action: false
  tags:
    - belief_reality_match
    - negative_control
