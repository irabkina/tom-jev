id: report_true_negative
description: >
  Sam wants to retrieve a report. The report is not in the office, and Sam
  correctly believes that the report is not in the office.

scenario_set: report

variant:
  type: true_negative

entities:
  agents:
    - id: sam
      name: Sam
  locations:
    - id: office
      name: office
  objects:
    - id: report
      name: report

observations: []

world_state:
  - predicate: located
    subject: report
    location: office
    value: false

goals:
  - agent: sam
    type: obtain
    object: report

mental_state:
  - type: belief
    agent: sam
    proposition:
      predicate: located
      subject: report
      location: office
      value: false

question:
  type: action_prediction
  agent: sam
  options:
    - go_to_office
    - do_not_go_to_office

ground_truth:
  answer: do_not_go_to_office
  explanation: >
    Sam wants to retrieve the report and correctly believes that the report
    is not in the office, so Sam should not go to the office to retrieve it.

annotations:
  world_supports_action: false
  agent_believes_action_supported: false
  belief_matches_reality: true
  mental_state_required: false
  tags:
    - belief_reality_match
    - negative_control
