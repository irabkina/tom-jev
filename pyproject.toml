[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "jev-rerepresentation"
version = "0.1.0"
description = "Re-representation experiments over JEV scenarios"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Irina Rabkina", email = "irabkina@gmail.com" }]
dependencies = [
    "pydantic>=2.0",
    "networkx>=3.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.hatch.build.targets.wheel]
packages = ["src/jev_rerepresentation"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
src = ["src", "experiments", "tests"]
